[project]
name = "finfrases"
version = "1.1.0"
description = "Uma API aberta e gratuita para frases de mentalidade financeira, investimentos e educação financeira, totalmente em português (PT-BR)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beanie>=2.2.0",
    "fastapi[standard]>=0.141.1",
    "loguru>=0.7.3",
    "pymongo>=4.18.0",
    "python-dotenv>=1.2.3",
    "redis[hiredis]>=8.1.0",
    "scalar-fastapi>=1.9.0",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.52.4",
]
[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]
