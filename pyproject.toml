[project]
name = "finfrases"
version = "1.0.2"
description = "Uma API aberta e gratuita para frases de mentalidade financeira, investimentos e educação financeira, totalmente em português (PT-BR)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beanie>=2.1.0",
    "fastapi[standard]>=0.139.0",
    "loguru>=0.7.3",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "redis[hiredis]>=8.0.1",
    "scalar-fastapi>=1.8.2",
    "uvicorn[standard]>=0.51.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
]
