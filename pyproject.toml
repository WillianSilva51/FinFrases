[project]
name = "finfrases"
version = "1.0.0"
description = "Uma API aberta e gratuita para frases de mentalidade financeira, investimentos e educação financeira, totalmente em português (PT-BR)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beanie>=2.1.0",
    "fastapi[standard]>=0.136.1",
    "loguru>=0.7.3",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "redis[hiredis]>=7.4.0",
    "uvicorn[standard]>=0.47.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.13",
]
