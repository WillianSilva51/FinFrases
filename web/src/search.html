<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth scrollbar-none dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="icon" type="image/png" href="https://img.icons8.com/?size=100&id=Yo9kOcztQ9xn&format=png&color=000000" />
    <link rel="stylesheet" href="css/output.css">
    <script type="module" src="js/main.js" defer></script>
    <title>FinFrases</title>
</head>

<body data-page="search"
    class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-white flex flex-col min-h-screen">
    <header
        class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-white/10 flex flex-wrap md:justify-start md:flex-nowrap z-50 w-full">
        <nav
            class="relative max-w-340 w-full md:flex md:items-center md:justify-between md:gap-3 mx-auto px-4 sm:px-6 lg:px-8 py-2">
            <div class="flex items-center justify-between">
                <a class="flex-none font-semibold text-xl text-slate-900 dark:text-gray-200 focus:outline-hidden focus:opacity-80 hover:animate-pulse"
                    href="index.html" aria-label="Brand">FinFrases</a>

                <div class="md:hidden">
                    <button type="button"
                        class="relative size-9 flex justify-center items-center text-sm font-semibold rounded-lg bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-white hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-hidden focus:bg-gray-50 dark:focus:bg-gray-700 disabled:opacity-50 cursor-pointer"
                        id="header-classic-collapse" aria-expanded="false" aria-controls="header-classic"
                        aria-label="Toggle navigation">
                        <i id="header-classic-open" class="material-symbols-outlined text-[18px]!">menu</i>
                        <i id="header-classic-close" class="material-symbols-outlined text-[18px]!" hidden>close</i>
                        <span class="sr-only">Toggle navigation</span>
                    </button>
                </div>
            </div>
            <div id="header-classic" class="hidden overflow-hidden transition-all duration-400 basis-full grow md:block"
                aria-labelledby="header-classic-collapse" role="region">
                <div
                    class="overflow-hidden overflow-y-auto max-h-[75vh] [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-none [&::-webkit-scrollbar-track]:bg-gray-100 dark:[&::-webkit-scrollbar-track]:bg-gray-700 [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-thumb]:bg-gray-500">
                    <div
                        class="py-2 md:py-0 flex flex-col md:flex-row md:items-center md:justify-end gap-0.5 md:gap-1 focus">
                        <a class="p-2 flex items-center text-sm text-gray-800 dark:text-gray-200 hover:text-gray-500 dark:hover:text-gray-400 focus:outline-hidden"
                            href="index.html" aria-current="page" id="initial-page-link">
                            <i class="material-symbols-outlined md:hidden text-[18px]! me-1.5">house</i>
                            Início
                        </a>

                        <a class="p-2 flex items-center text-sm text-cyan-600 dark:text-cyan-500 focus:outline-hidden"
                            href="search.html" id="search-quote-button">
                            <i class="material-symbols-outlined md:hidden text-[18px]! me-1.5">search</i>
                            Pesquisar
                        </a>

                        <div class="md:hidden">
                            <hr class="my-2 border-gray-200 dark:border-gray-700" />
                        </div>

                        <div
                            class="relative flex flex-wrap items-center gap-x-1.5 md:ps-2.5 mt-1 md:mt-0 md:ms-1.5 before:block before:absolute before:top-1/2 before:-inset-s-px before:w-px before:h-4 before:bg-gray-200 dark:before:bg-gray-700 before:-translate-y-1/2">
                            <button id="theme-toggle"
                                class="cursor-pointer p-2 w-full flex items-center text-sm text-gray-800 dark:text-gray-200 hover:text-gray-500 dark:hover:text-gray-400 focus:outline-hidden">
                                <i id="theme-toggle-icon"
                                    class="material-symbols-outlined text-[18px]! me-1.5">dark_mode</i>
                                <span class="md:hidden">Alternar tema</span>
                            </button>
                        </div>

                        <div class="relative flex flex-wrap items-center group-first-of-type:ap-x-1.5">
                            <a href=" https://github.com/WillianSilva51/FinFrases" target="_blank"
                                rel="noopener noreferrer"
                                class="cursor-pointer p-2 w-full flex items-center text-sm text-gray-800 dark:text-gray-200 hover:text-gray-500 dark:hover:text-gray-400 focus:outline-hidden">
                                <img src="https://www.svgrepo.com/show/439171/github.svg" alt="GitHub Logo"
                                    loading="lazy" class="w-5 h-5 me-1" />
                                <span class="md:hidden">Repositório do Projeto</span>
                            </a>
                        </div>

                        <hr class="my-2 border-gray-200 dark:border-gray-700 md:hidden" />

                        <div
                            class="relative flex flex-wrap items-center gap-x-1.5 md:ps-2.5 mt-1 md:mt-0 md:ms-1.5 before:block before:absolute before:top-1/2 before:-inset-s-px before:w-px before:h-4 before:bg-gray-200 dark:before:bg-gray-700 before:-translate-y-1/2">
                            <a class="p-2 w-full flex items-center text-sm text-gray-800 dark:text-gray-200 hover:text-gray-500 dark:hover:text-gray-400 focus:outline-hidden"
                                href="login.html">
                                <i class="material-symbols-outlined text-[18px]! me-1.5">lock_person</i>
                                <span class="md:hidden">Área Administrativa</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main class="flex grow flex-col items-center justify-center py-10 px-4 max-w-5xl mx-auto w-full">
        <h1 id="search-title" class="text-3xl md:text-4xl font-bold text-center mb-8">Pesquisar Frases</h1>
        <section
            class="min-w-full p-6 md:p-8 bg-white dark:bg-slate-800/80 backdrop-blur-md rounded-2xl border border-slate-200 dark:border-white/10 shadow-xl">
            <form id="search-form" class="flex flex-col gap-4">
                <legend class="text-sm font-medium text-gray-700 dark:text-gray-300">Pesquisa</legend>

                <fieldset class="flex flex-col md:flex-row gap-4">

                    <div class="relative grow">
                        <input type="text" name="search" id="search-input"
                            placeholder="Digite um autor, palavra-chave ou frase..."
                            class="w-full border border-gray-300 dark:border-gray-700 bg-slate-50 dark:bg-slate-900 rounded-lg px-4 py-2 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-cyan-500">
                    </div>

                    <button type="button" id="toggle-filters-btn" aria-expanded="false"
                        aria-controls="filters-container"
                        class="bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-medium py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 cursor-pointer border border-slate-300 dark:border-slate-600">
                        <i id="toggle-filters-icon" class="material-symbols-outlined text-[20px]">tune</i>
                        <span>Filtros</span>
                    </button>

                    <button type="submit"
                        class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 px-6 rounded-lg transition-colors flex items-center justify-center gap-2 cursor-pointer">
                        <i class="material-symbols-outlined text-[20px]">search</i>
                        <span>Pesquisar</span>
                    </button>
                </fieldset>

                <div hidden aria-hidden="true" id="filters-container"
                    class="flex-col gap-4 pt-4 border-t border-gray-200 dark:border-gray-700/50 transition duration-200">
                    <div class=" flex flex-col gap-4 mt-4">
                        <legend class="text-sm font-medium text-gray-700 dark:text-gray-300">Filtros</legend>
                        <fieldset
                            class="flex flex-wrap justify-center items-center gap-6 pt-2 border-t border-gray-100 dark:border-gray-700/50">

                            <div class="flex items-center gap-2">
                                <input checked type="checkbox" name="verified" id="verified-checkbox"
                                    class="w-4 h-4 text-cyan-600 rounded border-gray-300 focus:ring-cyan-500">
                                <label for="verified-checkbox"
                                    class="text-sm text-gray-700 dark:text-gray-300 cursor-pointer">Apenas frases
                                    verificadas</label>
                            </div>

                            <div class="flex items-center gap-2">
                                <label for="tags-select"
                                    class="text-sm font-medium text-gray-700 dark:text-gray-300">Categoria:</label>
                                <select name="tags" id="tags-select"
                                    class="border border-gray-300 dark:border-gray-700 bg-slate-50 dark:bg-slate-900 rounded-lg px-3 py-1.5 text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-cyan-500">
                                    <optgroup label="Categorias">
                                        <option value="" selected>Todas</option>
                                        <option value="geral">Geral</option>
                                        <option value="investimentos">Investimentos</option>
                                        <option value="poupanca">Poupança</option>
                                        <option value="psicologia">Psicologia</option>
                                        <option value="dividendos">Dividendos</option>
                                        <option value="educacao">Educação</option>
                                        <option value="empreendedorismo">Empreendedorismo</option>
                                        <option value="acao">Ação</option>
                                        <option value="fiis">FIIs</option>
                                    </optgroup>
                                </select>
                            </div>
                        </fieldset>

                        <fieldset
                            class="flex flex-wrap justify-center items-center gap-6 pt-2 border-t border-gray-100 dark:border-gray-700/50">
                            <legend class="text-sm font-medium text-gray-700 dark:text-gray-300">Ordenação</legend>
                            <div class="flex items-center gap-2">
                                <label for="sort-select"
                                    class="text-sm font-medium text-gray-700 dark:text-gray-300">Ordenar
                                    por:</label>
                                <select name="sort_by" id="sort-select"
                                    class="border border-gray-300 dark:border-gray-700 bg-slate-50 dark:bg-slate-900 rounded-lg px-3 py-1.5 text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-cyan-500">
                                    <optgroup label="Opções de Ordenação">
                                        <option value="content" selected>Conteúdo</option>
                                        <option value="author">Autor</option>
                                        <option value="tags">Tags</option>
                                        <option value="created_at">Data de Criação</option>
                                        <option value="updated_at">Data de Atualização</option>
                                    </optgroup>
                                </select>
                            </div>

                            <div class="flex items-center gap-2  md:ms-4">
                                <label for="order-select"
                                    class="text-sm font-medium text-gray-700 dark:text-gray-300">Ordem:</label>
                                <select name="order" id="order-select"
                                    class="border border-gray-300 dark:border-gray-700 bg-slate-50 dark:bg-slate-900 rounded-lg px-3 py-1.5 text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-cyan-500">
                                    <optgroup label="Opções de Ordem">
                                        <option value="asc" selected>Crescente</option>
                                        <option value="desc">Decrescente</option>
                                    </optgroup>
                                </select>
                            </div>
                        </fieldset>
                    </div>
                </div>
            </form>
        </section>

        <div id="status-message" class="mt-8 text-center">
            <p id="status-text" class="text-gray-500 dark:text-gray-400 text-lg">Carregando...</p>
        </div>

        <section id="results-container" class="mt-8 w-full flex justify-center flex-col items-center gap-6">
            <div id="search-results" class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">

            </div>
            <div id="pagination-container" class="mt-6">

            </div>

        </section>
    </main>
    <footer class="flex justify-center p-4 dark:bg-gray-800 border-t dark:border-white/10 bg-slate-50 border-black/10">
        <small class="dark:text-slate-400 text-slate-900">&copy FinFrases 2026 — Todos os Direitos Reservados</small>
    </footer>
</body>

</html>
