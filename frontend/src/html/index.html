<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="../css/output.css">
    <script type="module" src="../js/main.js" defer></script>
    <title>FinFrases</title>
</head>

<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-white">
    <header
        class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-white/10 flex flex-wrap md:justify-start md:flex-nowrap z-50 w-full">
        <nav
            class="relative max-w-340 w-full md:flex md:items-center md:justify-between md:gap-3 mx-auto px-4 sm:px-6 lg:px-8 py-2">
            <div class="flex items-center justify-between">
                <a class="flex-none font-semibold text-xl text-slate-900 dark:text-gray-200 focus:outline-hidden focus:opacity-80 hover:animate-pulse"
                    href="" aria-label="Brand">FinFrases</a>

                <div class="md:hidden">
                    <button type="button"
                        class="relative size-9 flex justify-center items-center text-sm font-semibold rounded-lg bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-white hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-hidden focus:bg-gray-50 dark:focus:bg-gray-700 disabled:opacity-50 cursor-pointer"
                        id="header-classic-collapse" aria-expanded="false" aria-controls="header-classic"
                        aria-label="Toggle navigation">
                        <i id="header-classic-open" class="material-symbols-outlined text-[18px]!">menu</i>
                        <i id="header-classic-close" class="material-symbols-outlined text-[18px]!" hidden>close</i>
                        <span class="sr-only">Toggle navigation</span>
                    </button>
                </div>
            </div>
            <div id="header-classic" class="hidden overflow-hidden transition-all duration-400 basis-full grow md:block"
                aria-labelledby="header-classic-collapse" role="region">
                <div
                    class="overflow-hidden overflow-y-auto max-h-[75vh] [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-none [&::-webkit-scrollbar-track]:bg-gray-100 dark:[&::-webkit-scrollbar-track]:bg-gray-700 [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-thumb]:bg-gray-500">
                    <div
                        class="py-2 md:py-0 flex flex-col md:flex-row md:items-center md:justify-end gap-0.5 md:gap-1 focus">
                        <a class="p-2 flex items-center text-sm text-cyan-600 dark:text-cyan-500 focus:outline-hidden"
                            href="#quote" aria-current="page" id="today-quote-link">
                            <i class="material-symbols-outlined md:hidden text-[18px]! me-1.5">today</i>
                            Diária
                        </a>

                        <a class="p-2 flex items-center text-sm text-gray-800 dark:text-gray-200 hover:text-gray-500 dark:hover:text-gray-400 focus:outline-hidden"
                            href="#quote" id="random-quote-link">
                            <i class="material-symbols-outlined md:hidden  text-[18px]! me-1.5">shuffle</i>
                            Aleatória
                        </a>

                        <a class="p-2 flex items-center text-sm text-gray-800 dark:text-gray-200 hover:text-gray-500 dark:hover:text-gray-400 focus:outline-hidden"
                            href="./search.html" id="search-quote-button">
                            <i class="material-symbols-outlined md:hidden text-[18px]! me-1.5">search</i>
                            Pesquisar
                        </a>

                        <div class="md:hidden">
                            <hr class="my-2 border-gray-200 dark:border-gray-700" />
                        </div>

                        <div
                            class="relative flex flex-wrap items-center gap-x-1.5 md:ps-2.5 mt-1 md:mt-0 md:ms-1.5 before:block before:absolute before:top-1/2 before:-inset-s-px before:w-px before:h-4 before:bg-gray-200 dark:before:bg-gray-700 before:-translate-y-1/2">
                            <button id="theme-toggle"
                                class="cursor-pointer p-2 w-full flex items-center text-sm text-gray-800 dark:text-gray-200 hover:text-gray-500 dark:hover:text-gray-400 focus:outline-hidden">
                                <i id="theme-toggle-icon"
                                    class="material-symbols-outlined text-[18px]! me-1.5">dark_mode</i>
                                <span class="md:hidden">Alternar tema</span>
                            </button>
                        </div>

                        <div class="relative flex flex-wrap items-center group-first-of-type:ap-x-1.5">
                            <a href=" https://github.com/WillianSilva51/FinFrases" target="_blank"
                                rel="noopener noreferrer"
                                class="cursor-pointer p-2 w-full flex items-center text-sm text-gray-800 dark:text-gray-200 hover:text-gray-500 dark:hover:text-gray-400 focus:outline-hidden">
                                <img src="https://www.svgrepo.com/show/439171/github.svg" alt="GitHub Logo"
                                    loading="lazy" class="w-5 h-5 me-1" />
                                <span class="md:hidden">Repositório do Projeto</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main class="min-h-[calc(100vh-105px)] flex flex-col items-center justify-center">
        <h1 id="quote-title" class="text-3xl md:text-4xl font-bold text-center mb-8">Frase Diária</h1>
        <section id="quote" class="flex flex-col items-center justify-center w-full">
            <div id="quote-container"
                class="max-w-2xl md:w-full p-8 mx-4 bg-slate-800/95 dark:bg-white/5 backdrop-blur-md rounded-2xl border border-black/10 dark:border-white/10 shadow-2xl flex justify-center flex-col transition-all duration-500 hover:-translate-y-1.5 hover:shadow-2xl dark:hover:shadow-cyan-500/20 hover:shadow-cyan-900">
                <q id="quote-text" class="text-2xl md:text-3xl text-slate-100 italic text-center font-light">Carregando
                    Frase....</q>
                <small id="quote-author" class="text-right text-emerald-400 font-semibold mt-6" hidden>Carregando
                    Autor...</small>
                <small id="quote-source" class="text-left text-emerald-500 font-semibold mt-4" hidden>Carregando
                    Fonte...</small>
            </div>
            <div id="quote-tags" class="flex flex-wrap justify-center gap-2 mt-4" hidden>
            </div>
            <button id="random-quote-button"
                class="mt-8 px-6 py-3 bg-cyan-700 cursor-pointer text-white rounded-lg shadow-md hover:bg-cyan-900 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:ring-offset-2 transition-all duration-300 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-cyan-500/20 animate-pulse"
                aria-label="Nova Frase Aleatória" hidden>
                Nova Frase Aleatória
            </button>
        </section>
        <aside class="mt-12 text-center">
            <p>Quer usar a API? Consulte a documentação.</p>
            <a href="/api/docs" target="_blank" rel="noopener noreferrer"
                class="text-cyan-600 hover:text-cyan-500 dark:text-cyan-500 dark:hover:text-cyan-400 shadow-md hover:shadow-cyan-500/20 transition-all duration-300">
                Acessar a documentação
            </a>
        </aside>
    </main>
    <footer class="flex justify-center p-4 dark:bg-gray-800 border-t dark:border-white/10 bg-slate-50 border-black/10">
        <small class="dark:text-slate-400 text-slate-900">&copy FinFrases 2026 — Todos os Direitos Reservados</small>
    </footer>
</body>

</html>
